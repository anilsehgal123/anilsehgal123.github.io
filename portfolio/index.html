<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- The text that shows in the browser tab and in Google search results.
       Change these two lines to change how the site appears when shared. -->
  <title>Anil Sehgal — Sales &amp; Distribution Leadership</title>
  <meta name="description" content="Thirty years building teams and distribution businesses across automotive aftermarket, lubricants and spares.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <a class="skip-link" href="#main">Skip to content</a>

  <!-- ===== Navigation bar ===== -->
  <header class="topbar" id="topbar">
    <div class="topbar__inner">
      <a class="topbar__name" href="#top" data-mount="navName"></a>

      <button class="topbar__toggle" id="navToggle" aria-expanded="false" aria-controls="navLinks">
        <span class="topbar__toggle-icon" aria-hidden="true">
          <span class="topbar__toggle-bar"></span>
          <span class="topbar__toggle-bar"></span>
        </span>
        <span class="topbar__toggle-label">Menu</span>
      </button>

      <nav class="topbar__nav" id="navLinks" aria-label="Sections">
        <a href="#approach">Leadership</a>
        <a href="#experience">Experience</a>
        <a href="#earlier">Earlier career</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main id="main">

    <!-- ===== Opening ===== -->
    <section class="hero" id="top">
      <div class="wrap hero__grid">
        <div class="hero__text">
          <p class="hero__place" data-mount="heroPlace"></p>
          <h1 class="hero__name" data-mount="heroName"></h1>
          <p class="hero__headline" data-mount="heroHeadline"></p>
          <p class="hero__intro" data-mount="heroIntro"></p>
          <div class="hero__actions" data-mount="heroActions"></div>
        </div>
        <div class="hero__portrait" data-mount="heroPortrait"></div>
      </div>
    </section>

    <!-- ===== What I'm looking for ===== -->
    <section class="seeking" id="seeking" data-mount="seeking"></section>

    <!-- ===== How I lead ===== -->
    <section class="band" id="approach">
      <div class="wrap">
        <h2 class="section-title" data-mount="approachHeading"></h2>
        <p class="section-lede" data-mount="approachIntro"></p>
        <div class="principles" data-mount="approach"></div>
      </div>
    </section>

    <!-- ===== Experience ===== -->
    <section class="band band--tint" id="experience">
      <div class="wrap">
        <h2 class="section-title" data-mount="experienceHeading"></h2>
        <div class="roles" data-mount="experience"></div>
      </div>
    </section>

    <!-- ===== Brands ===== -->
    <section class="band band--slim" id="brands" data-mount="brands"></section>

    <!-- ===== Earlier career ===== -->
    <section class="band" id="earlier">
      <div class="wrap">
        <h2 class="section-title" data-mount="earlierHeading"></h2>
        <div class="roles roles--compact" data-mount="earlier"></div>
      </div>
    </section>

    <!-- ===== Education ===== -->
    <section class="band band--tint band--slim" id="education">
      <div class="wrap">
        <h2 class="section-title" data-mount="educationHeading"></h2>
        <div class="schooling" data-mount="education"></div>
      </div>
    </section>

  </main>

  <!-- ===== Contact ===== -->
  <footer class="closing" id="contact">
    <div class="wrap">
      <h2 class="closing__title" data-mount="contactHeading"></h2>
      <p class="closing__body" data-mount="contactBody"></p>
      <div class="closing__lines" data-mount="contactLines"></div>
      <p class="closing__fine" data-mount="contactFine"></p>
    </div>
  </footer>

  <!-- Content first, then the code that places it on the page. -->
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
